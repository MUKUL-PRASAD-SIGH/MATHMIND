# LaTeX -> expected SymPy object (T3.1). `expected` is SymPy syntax; single letters are real symbols.
# Equations/inequalities are compared side-by-side (after simplification), so 2(x-3) == 2x-6 is fine.
parse:
  # integers, signs, arithmetic operators
  - {latex: "7", expected: "7"}
  - {latex: "-5", expected: "-5"}
  - {latex: "7-12", expected: "-5"}
  - {latex: "3\\cdot 4", expected: "12"}
  - {latex: "3\\times 4", expected: "12"}
  - {latex: "12\\div 4", expected: "3"}
  - {latex: "(-3)\\times(-4)", expected: "12"}
  - {latex: "−3x", expected: "-3*x"}
  # decimals become exact rationals
  - {latex: "6.5", expected: "Rational(13, 2)"}
  - {latex: "0.1+0.2", expected: "Rational(3, 10)"}
  # implicit multiplication
  - {latex: "2x", expected: "2*x"}
  - {latex: "xy", expected: "x*y"}
  - {latex: "2(x-3)", expected: "2*x-6"}
  - {latex: "x(x-2)", expected: "x**2-2*x"}
  - {latex: "(x-2)(x-3)", expected: "(x-2)*(x-3)"}
  - {latex: "-2(x-4)", expected: "-2*x+8"}
  # powers
  - {latex: "x^2", expected: "x**2"}
  - {latex: "x^{2}", expected: "x**2"}
  - {latex: "2^{10}", expected: "1024"}
  - {latex: "2^{-3}", expected: "Rational(1, 8)"}
  - {latex: "(x^{2})^{3}", expected: "x**6"}
  - {latex: "x^{-2}\\cdot x^{5}", expected: "x**3"}
  - {latex: "x²+1", expected: "x**2+1"}
  # fractions
  - {latex: "\\frac{a}{b}", expected: "a/b"}
  - {latex: "\\dfrac{1}{2}", expected: "Rational(1, 2)"}
  - {latex: "\\frac{1}{2}+\\frac{1}{3}", expected: "Rational(5, 6)"}
  - {latex: "\\frac{x^{5}\\cdot x^{3}}{x^{2}}", expected: "x**6"}
  - {latex: "\\frac{2x+3}{5}", expected: "(2*x+3)/5"}
  # roots
  - {latex: "\\sqrt{x+1}", expected: "sqrt(x+1)"}
  - {latex: "\\sqrt{16}", expected: "4"}
  - {latex: "\\sqrt[3]{8}", expected: "2"}
  - {latex: "4^{\\frac{1}{2}}", expected: "2"}
  # constants and functions
  - {latex: "\\pi r^2", expected: "pi*r**2"}
  - {latex: "e^{x}", expected: "exp(x)"}
  - {latex: "\\ln x", expected: "log(x)"}
  - {latex: "|x-1|", expected: "Abs(x-1)"}
  - {latex: "x_{1}+x_2", expected: "Symbol('x_{1}', real=True)+Symbol('x_{2}', real=True)"}
  # layout noise
  - {latex: "\\left(x+1\\right)^2", expected: "(x+1)**2"}
  - {latex: "\\displaystyle 2\\,x", expected: "2*x"}
  - {latex: "$x+1$", expected: "x+1"}
  - {latex: "= 2x+2", expected: "2*x+2"}
  # equations
  - {latex: "3x+5=20", expected: "Eq(3*x+5, 20)"}
  - {latex: "\\frac{2x+3}{5}=7", expected: "Eq((2*x+3)/5, 7)"}
  - {latex: "2(x-3)=10", expected: "Eq(2*x-6, 10)"}
  - {latex: "x=6.5.", expected: "Eq(x, Rational(13, 2))"}
  - {latex: "x^2-5x+6=0", expected: "Eq(x**2-5*x+6, 0)"}
  - {latex: "\\sqrt{x+2}=x", expected: "Eq(sqrt(x+2), x)"}
  # inequalities
  - {latex: "x\\le 3", expected: "Le(x, 3)"}
  - {latex: "x \\geq -1", expected: "Ge(x, -1)"}
  - {latex: "x \\geqslant -1", expected: "Ge(x, -1)"}
  - {latex: "-2x>4", expected: "Gt(-2*x, 4)"}
  - {latex: "x<5", expected: "Lt(x, 5)"}
  - {latex: "1<x\\le 3", expected: "And(Lt(1, x), Le(x, 3))"}
  - {latex: "x \\neq 2", expected: "Ne(x, 2)"}
  # root lists
  - {latex: "x=2 \\text{ or } x=3", expected: "Or(Eq(x, 2), Eq(x, 3))"}
  - {latex: "x=2 \\text{or} x=3", expected: "Or(Eq(x, 2), Eq(x, 3))"}
  - {latex: "x \\in \\{2,3\\}", expected: "Or(Eq(x, 2), Eq(x, 3))"}
  - {latex: "x=2, x=3", expected: "Or(Eq(x, 2), Eq(x, 3))"}
  - {latex: "x=-1 \\lor x=2", expected: "Or(Eq(x, -1), Eq(x, 2))"}

unparseable:
  - ""
  - "   "
  - "2x+"
  - "x)"
  - "((x)"
  - "\\frac{"
  - "a=b=c"
  - "x="
  - "="
  - "@#!"
  - "__import__('os').system('echo hi')"
  - "x=2 \\text{ or } 5+"
  - "1, 2"
