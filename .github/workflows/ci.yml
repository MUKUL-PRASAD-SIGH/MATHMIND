name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install (base + dev; heavy ML deps are excluded)
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check . ../ai/evaluation
          ruff format --check . ../ai/evaluation
      - name: Type-check
        run: mypy app
      - name: Contract is in sync with the code
        run: python scripts/export_contracts.py --check
      - name: Tests (no ML / LLM)
        run: pytest -m "not ml and not llm" --cov=app --cov-report=term-missing:skip-covered
      - name: Evaluation metric tests (T7.2)
        run: pytest ../ai/evaluation -q -p no:cacheprovider
      - name: Security scan
        run: bandit -q -r app

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend scaffold (lands with T0.2)
        id: detect
        run: |
          if [ -f frontend/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::frontend/ not scaffolded yet; skipping"; fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, lint, typecheck, test, build
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test -- --run
          npm run build
