name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install (base + dev; heavy ML deps are excluded)
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check . ../ai/evaluation
          ruff format --check . ../ai/evaluation
      - name: Type-check
        run: mypy app
      - name: Contract is in sync with the code
        run: python scripts/export_contracts.py --check
      - name: Tests (no ML / LLM)
        run: pytest -m "not ml and not llm" --cov=app --cov-report=term-missing:skip-covered
      - name: Evaluation metric tests (T7.2)
        run: pytest ../ai/evaluation -q -p no:cacheprovider
      - name: Security scan
        run: bandit -q -r app

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Detect frontend scaffold (lands with T0.2)
        id: detect
        run: |
          if [ -f frontend/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::frontend/ not scaffolded yet; skipping"; fi
      - uses: actions/setup-node@v5
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, lint, typecheck, test, build
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test -- --run
          npm run build

  e2e:
    # T7.3: Playwright on laptop/tablet/phone against MSW mocks, then against the real backend
    # (temp SQLite, Ollama deliberately unreachable). Not a required check yet.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend virtualenv (playwright.config.ts starts it from backend/.venv)
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: E2E (mocks)
        working-directory: frontend
        run: npx playwright test
      - name: E2E (real backend, AI unavailable)
        working-directory: frontend
        run: npx playwright test
        env:
          E2E_REAL: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7
